name: Feature request
description: Suggest an idea or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please **don't include personal information** such as your trainer ID, API key or email address. For open-ended ideas, [start a discussion](https://github.com/AbnormallyGrim/uma-stable-match/discussions) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web interface
        - API / server
        - Scoring
        - Club data from uma.moe
        - Installation / Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples or links. Remove any personal details first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I've searched existing issues and this hasn't been suggested yet.
          required: true
        - label: I've removed personal information such as trainer IDs, API keys and email addresses.
          required: true
