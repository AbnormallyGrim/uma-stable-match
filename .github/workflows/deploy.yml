name: Deploy

# Runs the end-to-end test after CI passes for a push to main, then deploys the server to Fly.io if
# it passes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# No permissions by default; each job asks only for what it needs.
permissions: {}

# One deploy at a time, and a running deploy is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  e2e:
    name: End-to-end test
    # Only CI runs for pushes to this repository's main. Without the last two checks, a pull request
    # from a fork's own main branch would match too.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Installs the toolchain and components from rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the page and the fixture server, then runs the test. See the frontend README.
      - name: End-to-end test
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # Comments on the merged pull request, and opens the e2e-failure issue or comments on the open
  # one, so repeated failures don't pile up issues.
  report:
    name: Report end-to-end failure
    needs: e2e
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write # Create the label, and open or comment on the issue.
      pull-requests: write # Comment on the merged pull request.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report the failure
        run: |
          message="The end-to-end test failed for ${HEAD_SHA:0:7}, so it wasn't deployed. See the [run]($RUN_URL) and its \`e2e-report\` artifact."
          pr=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "$message"
          fi

          gh label create e2e-failure --color B60205 \
            --description "The end-to-end test failed on main" 2>/dev/null || true
          issue=$(gh issue list --label e2e-failure --state open --limit 1 --json number \
            --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$message${pr:+ Merged in #$pr.}"
          else
            gh issue create --label e2e-failure --title "End-to-end test failing on main" \
              --body "$message${pr:+ Merged in #$pr.} Close this once it passes again."
          fi

  deploy:
    name: Deploy to Fly.io
    needs: e2e
    # Only CI runs for pushes to this repository's main. Without the last two checks, a pull request
    # from a fork's own main branch would match too.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # FLY_API_TOKEN is a secret of this environment, which can be limited to main. Create it with
    # `fly tokens create deploy -a uma-stable-match`.
    environment: production
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, 2026-04-08
        with:
          version: 0.4.114

      # Deploys unless main has moved on, or nothing the server or website is built from changed since
      # the live commit, read from the image's git-<commit> label. An unknown label deploys. The
      # website's index.md is served, so only Markdown in backend and frontend is left out.
      - name: Check for server changes
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ "$(git rev-parse origin/main)" != "$HEAD_SHA" ]; then
            echo "main has moved on; the run for the newer commit deploys."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          deployed=$(flyctl status --json 2>/dev/null | jq -r '.Machines[0].image_ref.tag // ""' | sed -n 's/^git-//p' || true)
          if [ -n "$deployed" ] && git cat-file -e "$deployed^{commit}" 2>/dev/null \
            && git diff --quiet "$deployed" "$HEAD_SHA" -- \
              backend frontend site Cargo.toml Cargo.lock rust-toolchain.toml Dockerfile .dockerignore fly.toml \
              ':(exclude)backend/*.md' ':(exclude)frontend/*.md'; then
            echo "Nothing the server is built from changed since $deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # Labels the image with the commit, for the next run's check.
      - name: Deploy
        if: steps.check.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --image-label "git-$HEAD_SHA"
