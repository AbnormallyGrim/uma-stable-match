name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  scoring:
    name: Scoring crate (docs, MSRV)
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build docs
        run: cargo doc -p uma-stable-match-scoring --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Install MSRV toolchain
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "uma-stable-match-scoring") | .rust_version')
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Publish dry run
        run: cargo publish --dry-run -p uma-stable-match-scoring

      - name: Package crate
        run: |
          cargo package -p uma-stable-match-scoring --no-verify
          mkdir "$RUNNER_TEMP/scoring"
          tar -xzf target/package/uma-stable-match-scoring-*.crate -C "$RUNNER_TEMP/scoring" --strip-components 1

      - name: Test on MSRV
        working-directory: ${{ runner.temp }}/scoring
        run: |
          cargo +stable generate-lockfile
          cargo +"$MSRV" test
          cargo +"$MSRV" test --all-features

  frontend:
    name: Frontend (check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint and formatting
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: uma-stable-match:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
