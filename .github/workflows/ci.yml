name: CI

on:
  push:
    branches: [main]
  pull_request:

# No permissions by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain and components from rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  scoring:
    name: Scoring crate (docs, MSRV)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install

      - name: Build docs
        run: cargo doc -p uma-stable-match-scoring --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Install MSRV toolchain
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "uma-stable-match-scoring") | .rust_version')
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Publish dry run
        run: cargo publish --dry-run -p uma-stable-match-scoring

      - name: Package crate
        run: |
          cargo package -p uma-stable-match-scoring --no-verify
          mkdir "$RUNNER_TEMP/scoring"
          tar -xzf target/package/uma-stable-match-scoring-*.crate -C "$RUNNER_TEMP/scoring" --strip-components 1

      - name: Test on MSRV
        working-directory: ${{ runner.temp }}/scoring
        run: |
          cargo +stable generate-lockfile
          cargo +"$MSRV" test
          cargo +"$MSRV" test --all-features

  frontend:
    name: Frontend (check, lint, test, build)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint and formatting
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: uma-stable-match:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
