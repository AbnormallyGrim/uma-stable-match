<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        font-family: 'Inter', sans-serif;
        background: #0f1217;
        color: #f0f4f8;
        position: relative;
    }
    .art {
        position: absolute;
        inset: 0;
        background: url('hero.jpeg') no-repeat;
        background-size: auto 630px;
        background-position: 235px 0;
    }
    .shade {
        position: absolute;
        inset: 0;
        background:
            linear-gradient(90deg, #0f1217 0%, #0f1217 34%, rgba(15, 18, 23, 0.6) 48%, rgba(15, 18, 23, 0) 60%),
            radial-gradient(circle at 18% 85%, rgba(212, 175, 55, 0.10) 0%, rgba(212, 175, 55, 0) 45%);
    }
    .text {
        position: absolute;
        left: 72px;
        top: 0;
        bottom: 0;
        width: 520px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
    }
    .badge {
        align-self: flex-start;
        background: rgba(212, 175, 55, 0.12);
        color: #d4af37;
        border: 1px solid rgba(212, 175, 55, 0.4);
        padding: 8px 18px;
        border-radius: 50px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    h1 {
        font-size: 62px;
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -1.5px;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    p {
        font-size: 26px;
        line-height: 1.4;
        color: #94a3b8;
        font-weight: 500;
    }
    .cta {
        align-self: flex-start;
        background: #d4af37;
        color: #0f1217;
        font-size: 24px;
        font-weight: 700;
        padding: 16px 30px;
        border-radius: 10px;
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
    }
</style>
</head>
<body>
    <div class="art"></div>
    <div class="shade"></div>
    <div class="text">
        <span class="badge">Umamusume club finder</span>
        <h1>Find the club where you fit.</h1>
        <p>Ranked by your fan pace, member balance and open spots.</p>
        <span class="cta">Find your club →</span>
    </div>
</body>
</html>
