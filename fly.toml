# Fly.io settings for the public instance at app.umastable.com, which also serves the website at
# umastable.com.
# App names are global on Fly.io: change this if it's taken.
app = "uma-stable-match"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# The API key is never set here: it's a Fly secret (`fly secrets`).
# So are the human check's keys, TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY and TOKEN_SIGNING_KEY.
# Traces are on when the OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_EXPORTER_OTLP_HEADERS secrets are set.
# HOST, PORT and FRONTEND_DIR come from the Dockerfile.
[env]
  # JSON lines for a log search service. Keep RUST_LOG at info so logs hold no trainer IDs.
  LOG_FORMAT = "json"
  RUST_LOG = "info"
  # Captures a stack trace when an uma.moe request fails, for the "uma.moe request failed" log line.
  RUST_LIB_BACKTRACE = "1"
  # Fly's proxy adds each visitor's address as the right-most X-Forwarded-For entry.
  TRUST_FORWARDED_FOR = "true"
  # Only Fly's private network can reach this port; [http_service] publishes 8080 alone.
  METRICS_ADDR = "[::]:9464"
  # Wider than the default 80–900, so slower trainers also get clubs near their pace.
  SCAN_RANK_FROM = "1"
  SCAN_RANK_TO = "10000"
  SCAN_MAX_DETAILS = "5000"
  # Below the window, for slower trainers: down to this rank, or to the first clubs with no fans.
  SCAN_LOWER_RANK_TO = "15000"
  # Scores twice this many clubs per search. The wide window packs thousands of clubs near slower
  # paces, so the default 120 misses some of the best fits there.
  SHORTLIST_SIZE = "480"
  # The website, from `site/` in the image, for umastable.com. www.umastable.com redirects to it.
  SITE_HOST = "umastable.com"
  SITE_DIR = "/app/site"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the club pool lives in memory and refreshes on a schedule, so stopping when idle
  # would rescan uma.moe on every start. Deploy with `--ha=false` to keep a single machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Counts requests rather than connections, so a few connections held open can't fill the machine.
  # Past soft_limit Fly prefers other machines; at hard_limit it holds new requests back.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Fly scrapes the metrics every 15 seconds into its managed Prometheus.
[metrics]
  port = 9464
  path = "/metrics"

# Room for the club data of the wide scan window, which `DETAIL_CACHE_MB` caps at 256 MB by
# default. Raise both together if the cache fills up.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
