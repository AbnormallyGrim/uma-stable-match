app = "uma-stable-match"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  LOG_FORMAT = "json"
  RUST_LOG = "info"
  TRUST_FORWARDED_FOR = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
