services:
  server:
    build: .
    image: uma-stable-match
    # Always build locally; never pull an image with this name from a registry.
    pull_policy: build
    # Settings and the API key come from .env at start-up, never from the image.
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      FRONTEND_DIR: /app/frontend
      # Metrics stay off unless METRICS_PORT is set in .env.
      METRICS_ADDR: ${METRICS_PORT:+0.0.0.0:9464}
    # Reachable only from this computer. PORT and METRICS_PORT in .env pick the ports.
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
      - "127.0.0.1:${METRICS_PORT:-9464}:9464"
    depends_on:
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Optional shared cache: `docker compose --profile redis up` with REDIS_URL=redis://redis:6379.
  redis:
    image: redis:7.4-alpine
    profiles: [redis]
    # Memory only: no snapshots or append-only file, so nothing reaches the disk.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    # Not published: only the server can reach it, over the Compose network.
    user: redis
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
