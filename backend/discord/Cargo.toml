[package]
name = "uma-stable-match-discord"
description = "Discord REST client and interactions endpoint for Uma Stable Match's club applications."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "uma_stable_match_discord"

[dependencies]
axum = "0.8"
base64 = "0.23"
ed25519-dalek = "3"
getrandom = "0.3"
hmac = "0.13"
metrics = "0.24"
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[lints]
workspace = true
