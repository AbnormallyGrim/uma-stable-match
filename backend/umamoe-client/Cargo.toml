[package]
name = "uma-stable-match-umamoe-client"
description = "Client for the uma.moe API, used to fetch Umamusume: Pretty Derby club and member data."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "uma_stable_match_umamoe_client"

[dependencies]
fastrand = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uma-stable-match-scoring = { version = "0.1.0", path = "../scoring" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
