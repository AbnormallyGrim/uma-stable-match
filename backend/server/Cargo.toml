[package]
name = "uma-stable-match-server"
description = "API server for Uma Stable Match, with a scheduled club scanner and a cache."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "uma_stable_match_server"

[[bin]]
name = "uma-stable-match-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dotenvy = "0.15"
fastrand = "2"
governor = "0.10"
humantime = "2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
moka = { version = "0.12", features = ["future"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "script", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
hmac = "0.13"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uma-stable-match-scoring = { version = "0.1.0", path = "../scoring", features = ["serde"] }
uma-stable-match-umamoe-client = { version = "0.1.0", path = "../umamoe-client" }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6"

[lints]
workspace = true
