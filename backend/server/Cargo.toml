[package]
name = "uma-stable-match-server"
description = "API server for Uma Stable Match, with a scheduled club scanner and a cache."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "uma_stable_match_server"

[[bin]]
name = "uma-stable-match-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
humantime = "2"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uma-stable-match-scoring = { version = "0.1.0", path = "../scoring" }
uma-stable-match-umamoe-client = { version = "0.1.0", path = "../umamoe-client" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[lints]
workspace = true
