[package]
name = "uma-stable-match-server"
description = "API server for Uma Stable Match, with a scheduled club scanner and a cache."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "uma_stable_match_server"

[[bin]]
name = "uma-stable-match-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
dotenvy = "0.15"
governor = "0.10"
humantime = "2"
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uma-stable-match-scoring = { version = "0.1.0", path = "../scoring" }
uma-stable-match-umamoe-client = { version = "0.1.0", path = "../umamoe-client" }

[dev-dependencies]
fastrand = "2"
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
